<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1109">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="pro.css">
<link rel="icon" href="icons/icon-192.png">
<title>Tank Defense</title>
<style>
:root{--gold:#ffc83d;--ice:#5fd4ff;--ember:#ff6a2b;--steel:#1b2318;--hz:repeating-linear-gradient(-45deg,#ffc83d 0 14px,#17190f 14px 28px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:#0a1109;color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.gl{position:relative;background:linear-gradient(180deg,#3a4430 0,#232b1d 12%,#151b11 100%);border:1px solid #5b6a48;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 2px rgba(0,0,0,.35)}
.gl::before,.gl::after{content:"";position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:radial-gradient(#d9d9c0,#555);opacity:.8}
.gl::before{left:6px}.gl::after{right:6px}
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:7px;align-items:center;pointer-events:none;z-index:3}
.st{padding:6px 12px;font-weight:900;font-size:15px;white-space:nowrap;text-shadow:0 1px 3px #000}
.st span{display:inline-block}.pop{animation:pop .35s}@keyframes pop{40%{transform:scale(1.5);color:var(--gold)}}
#hpw{flex:1;height:18px;border-radius:5px;background:#0b0d08;border:2px solid #5b6a48;overflow:hidden;min-width:60px;position:relative}
#hpb{height:100%;width:100%;background:linear-gradient(90deg,#b71c1c,#ff6a2b,#ffc83d);transition:width .35s;position:relative}
#hpb::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);animation:shine 2.4s infinite}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.ib{pointer-events:auto;width:42px;height:42px;font-size:19px;display:grid;place-items:center;color:#fff;border-radius:12px}
.ib:active,.tb:active,.up:active,.go:active,.lc:active{transform:scale(.93)}
#shop{position:fixed;bottom:max(6px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:7px 9px;max-width:98vw;overflow-x:auto;z-index:3}
.tb{position:relative;overflow:hidden;width:72px;height:68px;border-radius:10px;border:2px solid #4a5a3a;background:linear-gradient(180deg,#2c3724,#10150d);color:#fff;font:800 11px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;transition:transform .15s,box-shadow .2s}
.tb i{font-style:normal;font-size:23px;filter:drop-shadow(0 2px 2px #000)}.tb b{color:var(--gold);font-size:13px}
.tb.on{border-color:var(--gold);box-shadow:0 0 18px rgba(255,200,61,.7);transform:translateY(-5px);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.tb.on::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);animation:shine 2s infinite}
.tb.off{opacity:.4}
.tb em{position:absolute;top:3px;left:5px;font:800 10px inherit;font-style:normal;color:var(--ice)}
#panel{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;gap:8px;padding:8px;z-index:5;animation:rise .25s}
@keyframes rise{from{opacity:0;transform:translate(-50%,24px) scale(.9)}}
.up{width:92px;padding:8px 4px;border-radius:10px;border:2px solid #4a5a3a;background:linear-gradient(180deg,#2c3724,#10150d);color:#fff;font:800 12px inherit;text-align:center}
.up b{display:block;color:var(--gold);margin-top:3px}.up.sell{border-color:#b3382c}.up.max{opacity:.45}
#toast{position:fixed;top:19%;left:0;right:0;margin:auto;width:max-content;max-width:94vw;padding:10px 34px;font-size:clamp(18px,4.4vw,28px);font-weight:900;display:none;text-align:center;z-index:4;text-shadow:0 0 14px currentColor;border-radius:4px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
#toast.show{display:block;animation:ban 1.9s both}@keyframes ban{0%{transform:translateX(90vw) skewX(-14deg);opacity:0}12%{transform:none;opacity:1}86%{transform:none;opacity:1}100%{transform:translateX(-90vw) skewX(14deg);opacity:0}}
#toast.boss{color:var(--ember);animation-name:ban,sh;animation-duration:2.6s,.25s;animation-iteration-count:1,10}@keyframes sh{25%{margin-left:-6px}75%{margin-left:6px}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 35%,rgba(18,34,16,.7),rgba(4,8,3,.94));backdrop-filter:blur(5px);text-align:center;z-index:9;overflow:hidden;padding:12px}
.ov.hide{display:none}
.radar{position:absolute;width:150vmax;height:150vmax;left:50%;top:40%;margin:-75vmax;background:conic-gradient(from 0deg,rgba(90,255,120,.16),transparent 22%);border-radius:50%;animation:spin 7s linear infinite;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}
.hz{width:min(520px,86vw);height:12px;background:var(--hz);background-size:40px 40px;animation:hzm 1.2s linear infinite;border-radius:3px;box-shadow:0 0 14px rgba(255,200,61,.4)}@keyframes hzm{to{background-position:40px 0}}
.ov h1{position:relative;font-size:clamp(34px,8vw,66px);font-weight:900;line-height:1.1;background:linear-gradient(180deg,#fff7c4,#ffc83d 50%,#e07a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #4a2a05) drop-shadow(0 0 18px rgba(255,150,0,.5));animation:tin .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tin{from{transform:scale(2.4) rotate(-6deg);opacity:0}}
.sub{opacity:.85;font-size:15px;position:relative;animation:fi .8s .3s both}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
#lvls{display:flex;gap:12px;position:relative;max-width:100%;overflow-x:auto;padding:10px 6px}
.lc{flex:none;width:clamp(120px,21vw,170px);border-radius:12px;padding:7px;cursor:pointer;animation:cin .6s both;transition:transform .2s}
.lc:nth-child(2){animation-delay:.12s}.lc:nth-child(3){animation-delay:.24s}.lc:nth-child(4){animation-delay:.36s}
@keyframes cin{from{opacity:0;transform:translateY(40px) rotate(4deg)}}
.lc canvas{position:static;width:100%;height:auto;border-radius:7px;display:block;border:1px solid #000}
.lc h3{font-size:14px;margin:6px 0 2px;font-weight:900}.lc small{opacity:.75;font-size:11px}
.lc .s{letter-spacing:2px;font-size:15px;filter:drop-shadow(0 0 5px #ffc83d)}.lc.lk{filter:grayscale(.9) brightness(.55)}.lc.lk::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;background:none;border:0;left:0;right:0;width:auto;height:auto;opacity:1}
.lc:not(.lk):hover{transform:translateY(-6px)}
#langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;position:relative}
.lg{padding:5px 11px;border-radius:20px;border:1px solid #5b6a48;background:#151b11;color:#cfd8bd;font:700 12px inherit}.lg.on{background:var(--gold);color:#201400;border-color:#fff}
.credit{position:relative;font-size:13px;margin-top:4px;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.45);border:1px solid rgba(255,200,61,.35);animation:glw 2.5s infinite}
.credit b{color:var(--gold)}@keyframes glw{50%{box-shadow:0 0 18px rgba(255,200,61,.55)}}
.drv{position:absolute;bottom:2px;left:-120px;width:110px;animation:drv 14s linear infinite;pointer-events:none;opacity:.9}@keyframes drv{to{left:calc(100% + 120px)}}
.go{position:relative;overflow:hidden;padding:12px 34px;border:0;border-radius:12px;font:900 18px inherit;color:#1b1200;background:linear-gradient(180deg,#ffe58a,#ffb300);box-shadow:0 0 24px rgba(255,170,0,.5),inset 0 -4px 0 rgba(0,0,0,.22)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);animation:shine 2.2s infinite}
.go.alt{background:linear-gradient(180deg,#566246,#2e3826);color:#fff;box-shadow:none}
#stars{font-size:46px;display:flex;gap:6px;position:relative}#stars span{animation:st .6s both;filter:drop-shadow(0 0 10px #ffc83d)}#stars span:nth-child(2){animation-delay:.25s}#stars span:nth-child(3){animation-delay:.5s}#stars span.z{filter:grayscale(1) brightness(.4)}
@keyframes st{from{transform:scale(3) rotate(-40deg);opacity:0}}
.row{display:flex;gap:10px;position:relative;flex-wrap:wrap;justify-content:center}
@media(max-height:430px){.ov{gap:5px}.ov h1{font-size:34px}.sub,.credit{font-size:11px}.lc{width:112px;padding:5px}.lc h3{font-size:12px;margin:3px 0 0}.go{padding:8px 24px;font-size:15px}.lg{padding:3px 9px}#stars{font-size:30px}}
#abil{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:3}
.ab{width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:800 10px inherit;line-height:1;border-width:2px}
.ab i{font-style:normal;font-size:22px}.ab small{color:var(--gold);margin-top:2px}.ab:active{transform:scale(.92)}.ab.off{opacity:.45}
#pz{position:fixed;inset:0;display:grid;place-items:center;font-size:84px;z-index:6;background:rgba(0,0,0,.35);pointer-events:none;text-shadow:0 0 30px #000}#pz.hide{display:none}
#worlds{display:flex;gap:8px;overflow-x:auto;max-width:96vw;padding:6px 8px 8px;position:relative;scrollbar-width:none}#worlds::-webkit-scrollbar{display:none}
.wc{flex:none;min-width:86px;padding:5px 10px;border-radius:12px;border:2px solid #3d4a30;background:linear-gradient(180deg,#2a3322,#10150d);color:#e6efd6;font:800 11px inherit;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .15s,box-shadow .2s}
.wc i{font-style:normal;font-size:20px}.wc small{color:var(--gold);font-size:10px}.wc.on{border-color:var(--cc,var(--gold));box-shadow:0 0 16px var(--cc,var(--gold));transform:translateY(-3px)}.wc.lk{filter:grayscale(.9) brightness(.55)}.wc:active{transform:scale(.94)}
.lc{border-color:var(--cc,#5b6a48)!important}.lc .ln{position:absolute;top:4px;right:6px;z-index:2;font-size:12px;background:rgba(0,0,0,.65);padding:1px 7px;border-radius:8px;color:var(--cc,#fff)}
.lg.tg{opacity:.55}.lg.tg.on{opacity:1;background:var(--cc,var(--gold));color:#111}
.ov#menu{justify-content:center;justify-content:safe center;overflow-y:auto}
@media(max-height:430px){.wc{min-width:76px;padding:3px 8px}.wc i{font-size:16px}.ab{width:44px;height:44px}.ab i{font-size:18px}#abil{bottom:calc(84px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="gl st">🪙 <span id="g">0</span></div>
 <div class="gl st">🎯 <span id="w">1</span><small id="wm"></small></div>
 <div class="gl st">🏗️ <span id="tc">0/8</span></div>
 <div id="hpw"><div id="hpb"></div></div>
 <button class="gl ib" id="bp">⏸</button><button class="gl ib" id="bs">1×</button><button class="gl ib" id="bm">🔊</button><button class="gl ib" id="bmu">🎵</button><button class="gl ib" id="bh">🏠</button>
</div>
<div id="abil"><button class="gl ab" id="ba"><i>💣</i><small id="bat">✓</small></button><button class="gl ab" id="br"><i>🛠️</i><small>250</small></button></div>
<div id="pz" class="hide">⏸</div>
<div id="toast" class="gl"></div>
<div id="panel" class="gl"></div>
<div id="shop" class="gl"></div>
<div class="ov" id="menu">
 <div class="radar"></div><div class="hz"></div>
 <h1 id="ttl"></h1><p class="sub" id="sub"></p>
 <div id="worlds"></div><div id="lvls"></div><div id="langs"></div>
 <div class="credit"><span id="cr"></span> <b>محمد العمري</b> · <b dir="ltr">730215825</b></div>
 <svg class="drv" viewBox="0 0 110 50"><ellipse cx="55" cy="46" rx="48" ry="4" fill="#0006"/><rect x="6" y="30" width="98" height="14" rx="7" fill="#1a1a1a"/><rect x="12" y="20" width="86" height="18" rx="5" fill="#59703f"/><rect x="34" y="8" width="38" height="16" rx="5" fill="#6e8a4e"/><rect x="68" y="13" width="40" height="5" rx="2" fill="#33382c"/><circle cx="52" cy="16" r="4" fill="#2b341f"/></svg>
</div>
<div class="ov hide" id="end"><div class="radar"></div><div class="hz"></div><h1 id="eT"></h1><div id="stars"></div><p class="sub" id="eP"></p>
 <div class="row"><button class="go" id="eN"></button><button class="go alt" id="eR"></button><button class="go alt" id="eM"></button></div>
 <div class="credit"><span id="cr2"></span> <b>محمد العمري</b> · <b dir="ltr">730215825</b></div></div>
<script src="game.js"></script>
<script src="pro.js"></script>
<script src="pro2.js"></script>
</body>
</html>
