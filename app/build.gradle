plugins {
    id 'com.android.application'
}

def kp = rootProject.file('keystore.properties')

android {
    namespace 'com.tankdefense.game'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.tankdefense.game'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '7.0.0'
    }

    signingConfigs {
        release {
            if (kp.exists()) {
                def p = new Properties()
                p.load(new FileInputStream(kp))
                storeFile file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (kp.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
